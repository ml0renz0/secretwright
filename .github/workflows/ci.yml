name: CI

on:
  push:
    branches-ignore:
      - main
      - codex/recover-rc2-draft
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit selected by the release planner
        type: string
        required: false
        default: ''
      release_tag:
        description: Prospective release tag to embed in the tested bundle
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_sha && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, vet, unit tests and static build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Download locked dependencies
        run: go mod download
      - name: Verify dependency checksums
        run: go mod verify
      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: make check

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: blueprint
            package: ./internal/blueprint
            function: FuzzLoad
          - target: architecture-templates
            package: ./internal/architecture
            function: FuzzRender
          - target: managed-state
            package: ./internal/managedstate
            function: FuzzDecode
          - target: logical-paths
            package: ./internal/vault
            function: FuzzResolvePath
          - target: x509-pem
            package: ./internal/pki
            function: FuzzInspectPEM
          - target: kerberos-keytab
            package: ./internal/keytab
            function: FuzzKeytab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Download locked dependencies
        run: go mod download
      - name: Exercise generated adversarial inputs
        run: go test -race -run='^$' -fuzz='^${{ matrix.function }}$' -fuzztime=20s -fuzzminimizetime=100ms -parallel=2 ${{ matrix.package }}
      - name: Preserve a failing input for reproduction
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Real Vault integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Download locked dependencies
        run: go mod download
      - name: Start ephemeral Vault, test and clean up
        env:
          VAULT_TEST_REQUIRE_DATABASE: '1'
        run: make integration-local

  packaging:
    name: Release archives, signatures and container acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test artifact verification, signatures and release policy
        run: python3 -m unittest discover -s tests/packaging -p 'test_*.py' -v
      - name: Validate the release policy and promotion diff
        if: ${{ inputs.source_sha == '' }}
        run: python3 scripts/release_plan.py --check --base-ref origin/main
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Install pinned and checksum-verified release tools
        run: bash scripts/install_release_tools.sh
      - name: Build and exercise the distributable bundle without publishing
        env:
          SECRETWRIGHT_RELEASE_SHA: ${{ inputs.source_sha }}
          SECRETWRIGHT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/package_ci.sh
      - name: Preserve verified distribution bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secretwright-release-bundle
          path: release-bundle/
          if-no-files-found: error
          retention-days: 2
